<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nailschik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
/* Layout: «лаковый поднос» с типсами в герое на молочном салонном фоне; mobile-first оболочка приложения с нижним таббаром */
:root{
  --bg:#FBF7F6; --surface:#FFFFFF; --sunk:#F5EDEC; --ink:#2A1220; --muted:#7E6672; --line:#EBDDDF;
  --lacquer:#B0103F; --lacquer-2:#8A0A30; --on-lacquer:#FFFFFF; --nude:#EFD9CF; --chip:#F3E9EA;
  --deep:#2A1220; --on-deep:#FBEFF3; --deep-muted:#C9AFBB;
  --good:#23704F; --good-bg:#E3F2EA; --warn:#97600F; --warn-bg:#FBEFD9; --bad:#B42335; --bad-bg:#FBE4E7; --info:#4A4F8C; --info-bg:#E9EAF6;
  --river:#CFDDEA; --road:#E8D9DB; --park:#E3EADB; --shadow:0 18px 40px -24px rgba(90,16,48,.45); --veil:rgba(42,18,32,.42);
  --f-display:"Yeseva One","Playfair Display",Georgia,serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-xl:30px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --tabbar:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150C11; --surface:#1F141A; --sunk:#1A1015; --ink:#F6EAF0; --muted:#B39BA8; --line:#35242D;
  --lacquer:#FF4F7E; --lacquer-2:#E23A68; --on-lacquer:#25060F; --nude:#3B2730; --chip:#2A1C23;
  --deep:#2A1820; --on-deep:#FBEFF3; --deep-muted:#C9AFBB;
  --good:#6BD3A4; --good-bg:#16302A; --warn:#F0BE63; --warn-bg:#33270F; --bad:#FF7787; --bad-bg:#3A161D; --info:#AEB4FF; --info-bg:#22243F;
  --river:#22313F; --road:#2E2128; --park:#1F2A20; --shadow:0 18px 40px -24px rgba(0,0,0,.8); --veil:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#150C11; --surface:#1F141A; --sunk:#1A1015; --ink:#F6EAF0; --muted:#B39BA8; --line:#35242D;
  --lacquer:#FF4F7E; --lacquer-2:#E23A68; --on-lacquer:#25060F; --nude:#3B2730; --chip:#2A1C23;
  --deep:#2A1820; --on-deep:#FBEFF3; --deep-muted:#C9AFBB;
  --good:#6BD3A4; --good-bg:#16302A; --warn:#F0BE63; --warn-bg:#33270F; --bad:#FF7787; --bad-bg:#3A161D; --info:#AEB4FF; --info-bg:#22243F;
  --river:#22313F; --road:#2E2128; --park:#1F2A20; --shadow:0 18px 40px -24px rgba(0,0,0,.8); --veil:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--lacquer);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:20px}
.display{font-family:var(--f-display);letter-spacing:-.01em}
.h2{font-family:var(--f-display);font-size:clamp(28px,4vw,42px);line-height:1.08}
.h3{font-family:var(--f-display);font-size:22px;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15.5px;white-space:nowrap;transition:transform .15s ease,background-color .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--lacquer);color:var(--on-lacquer);background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 22px -12px var(--lacquer)}
.btn-primary:hover{background-color:var(--lacquer-2)}
.btn-primary[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-soft{background:var(--chip);color:var(--ink)}
.btn-soft:hover{background:var(--line)}
.btn-line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--muted)}
.btn-sm{min-height:38px;padding:0 16px;font-size:14px}
.btn-block{width:100%}
.btn-danger{color:var(--bad)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;position:relative;color:var(--ink)}
.icon-btn:hover{background:var(--chip)}
.icon{width:20px;height:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-20px;padding-inline:20px}
.chips.scroll::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.done{background:var(--info-bg);color:var(--info)}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:8px;background:var(--chip);font-size:13px;font-weight:500;white-space:nowrap}
.star{color:#E0A100}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:66px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.logo svg{width:20px;height:30px}
.top-nav{display:flex;gap:4px;margin-left:12px}
.top-nav button{height:40px;padding:0 14px;border-radius:999px;font-weight:500;font-size:15px;color:var(--ink)}
.top-nav button:hover,.top-nav button.on{background:var(--chip)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.demo{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--chip)}
.demo span{font-size:12px;color:var(--muted);padding:0 8px 0 10px}
.demo button{height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.demo button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--lacquer);color:var(--on-lacquer);font-size:11px;font-weight:700;display:grid;place-items:center}
.me-btn{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 6px;border-radius:999px}
.me-btn:hover{background:var(--chip)}
@media (max-width:900px){.top-nav,.hide-m{display:none!important}.demo span{display:none}.top-in{gap:10px;height:60px}.logo{font-size:21px}}
@media (min-width:901px){.hide-d{display:none!important}}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:none}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tabbar button.on{color:var(--lacquer)}
.tabbar .badge{top:6px;right:calc(50% - 22px)}
@media (max-width:900px){.tabbar.show{display:block}body.has-tabbar main{padding-bottom:calc(var(--tabbar) + 24px)}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;grid-template-areas:"copy tray" "finder finder";gap:28px 40px;padding-block:44px 32px;align-items:center}
.hero-copy{grid-area:copy;display:flex;flex-direction:column;gap:20px}
.hero h1{font-family:var(--f-display);font-size:clamp(40px,6.2vw,78px);line-height:1;letter-spacing:-.025em}
.lead{font-size:clamp(17px,1.6vw,19px);color:var(--muted);max-width:30em}
.hero-stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:4px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:13.5px;color:var(--muted)}
.tray{grid-area:tray;background:var(--nude);border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.tray-art{aspect-ratio:5/4;max-width:100%;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,#F7E7E1 0%,#F3DCD3 55%,#EBCFC4 100%)}
.tray-art svg{width:100%;height:100%;display:block}
.tray-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tray .chip{background:color-mix(in srgb,var(--surface) 70%,transparent);border-color:transparent}
.tray .chip.on{background:var(--ink);color:var(--bg)}
.shape-seg{display:flex;gap:2px;padding:3px;background:color-mix(in srgb,var(--surface) 60%,transparent);border-radius:999px}
.shape-seg button{height:30px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.shape-seg button.on{background:var(--surface);color:var(--ink)}
.tray-cap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tray-cap p{font-size:14.5px}
.ft{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 70ms);transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ft{animation:none}*{scroll-behavior:auto!important;transition:none!important}}

.finder{grid-area:finder;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:8px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.field{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 16px;border-radius:18px;background:var(--sunk);min-width:0}
.field:focus-within{outline:2px solid var(--lacquer)}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field select,.field input{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:600;font-size:15px;padding:0 20px 0 0;outline:none;width:100%;min-width:0;text-overflow:ellipsis}
.field.sel::after{content:"";position:absolute;right:16px;bottom:18px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.finder .btn{min-height:60px;border-radius:18px;padding:0 26px}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;grid-template-areas:"copy" "finder" "tray";padding-block:24px 20px;gap:20px}
  .hero-stats{gap:16px;flex-wrap:nowrap}.hero-stats b{font-size:19px}.hero-stats span{font-size:12.5px;line-height:1.3}
  .tray .chips.scroll{margin-inline:-18px;padding-inline:18px}
  .finder{grid-template-columns:1fr 1fr;border-radius:24px}
  .finder .f-svc{grid-column:1/-1}
  .finder .btn{grid-column:1/-1;min-height:54px}
}

/* ---------- sections ---------- */
.sec{padding-block:44px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-head p{max-width:34em}
.svc-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.svc-item{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--surface);text-align:left;transition:background-color .15s}
.svc-item:hover{background:var(--sunk)}
.svc-item .ic{width:46px;height:46px;border-radius:14px;background:var(--nude);display:grid;place-items:center;flex:none;overflow:hidden}
.svc-item .ic svg{width:46px;height:46px}
.svc-item b{display:block;font-weight:600}
.svc-item span{font-size:13.5px;color:var(--muted)}
.svc-item .price{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:900px){.svc-list{grid-template-columns:1fr}}
.styles-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.style-card{text-align:left;display:flex;flex-direction:column;gap:10px}
.style-card .art{aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;transition:transform .25s ease}
.style-card:hover .art{transform:translateY(-3px)}
.style-card .art svg{width:100%;height:100%;display:block}
.style-card b{font-weight:600}
.style-card span{font-size:13.5px;color:var(--muted)}
@media (max-width:900px){.styles-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
@media (max-width:900px){.rail{grid-auto-columns:82%;margin-inline:-20px;padding-inline:20px;scroll-padding-inline:20px}}
.rev-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.rev-grid{grid-template-columns:1fr}}
.rev-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px}
.rev-card .q{font-size:15.5px}
.rev-who{display:flex;align-items:center;gap:10px;font-size:14px}
.rev-photos{display:flex;gap:8px}
.rev-photos button{width:64px;height:64px;border-radius:12px;overflow:hidden}
.rev-photos svg{width:100%;height:100%;display:block}
.pro-band{background:var(--deep);color:var(--on-deep);border-radius:var(--r-xl);padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;overflow:hidden}
.pro-band .muted{color:var(--deep-muted)}
.pro-band ul{list-style:none;padding:0;margin:18px 0 26px;display:grid;gap:10px}
.pro-band li{display:flex;gap:10px;align-items:flex-start}
.pro-band li svg{color:var(--lacquer);margin-top:3px}
.pro-mock{background:color-mix(in srgb,var(--on-deep) 8%,transparent);border:1px solid color-mix(in srgb,var(--on-deep) 14%,transparent);border-radius:var(--r-lg);padding:18px;display:grid;gap:12px}
.pro-mock .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pro-mock .kp div{background:color-mix(in srgb,var(--on-deep) 7%,transparent);border-radius:14px;padding:12px}
.pro-mock .kp b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.pro-mock .kp span{font-size:12.5px;color:var(--deep-muted)}
.pro-mock .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--on-deep) 6%,transparent);font-size:14px}
.pro-mock .row time{font-weight:700;font-variant-numeric:tabular-nums;width:46px}
@media (max-width:900px){.pro-band{grid-template-columns:1fr}}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-block:28px 40px;display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;font-size:14px;color:var(--muted)}

/* ---------- master card ---------- */
.ava{--h:340;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;color:#fff;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 70% 72%),hsl(var(--h) 55% 42%));box-shadow:0 0 0 2px var(--surface)}
.ava.lg{width:96px;height:96px;font-size:36px;box-shadow:0 0 0 5px var(--bg)}
.ava.sm{width:32px;height:32px;font-size:13px}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.mcard{position:relative;display:grid;grid-template-columns:230px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:box-shadow .2s,border-color .2s}
.mcard:hover{box-shadow:var(--shadow);border-color:transparent}
.mcard-media{position:relative;display:block;min-height:100%;background:var(--nude)}
.mcard-media>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pf-count{position:absolute;left:10px;bottom:10px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.88);color:#2A1220;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.fav{position:absolute;top:10px;left:10px;z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#2A1220;transition:transform .15s}
.fav:active{transform:scale(.88)}
.fav.on{color:#C8164A}
.fav.on svg path{fill:currentColor}
.mcard-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who h3{font-family:var(--f-display);font-size:21px;line-height:1.15}
.who h3 button{text-align:left}
.who h3 button:hover{color:var(--lacquer)}
.rate{display:flex;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap}
.rate b{font-weight:700}
.loc{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.loc .icon{width:16px;height:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.slots-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.slots-row>span{color:var(--muted);margin-right:2px}
.qslot{height:34px;padding:0 12px;border-radius:10px;background:var(--good-bg);color:var(--good);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.qslot:hover{outline:2px solid var(--good)}
.mcard-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.from{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.from small{font-size:14px;font-weight:500;color:var(--muted)}
.mcard.v{grid-template-columns:1fr}
.mcard.v .mcard-media{aspect-ratio:16/10;min-height:0}
@media (max-width:720px){.slots-row .qslot:nth-of-type(n+4){display:none}.mcard{grid-template-columns:1fr}.mcard-media{aspect-ratio:16/10;min-height:0}}

/* ---------- search ---------- */
.search-head{display:flex;flex-direction:column;gap:14px;padding-block:28px 18px}
.search-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.sort{position:relative}
.sort select{appearance:none;-webkit-appearance:none;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 36px 0 16px;font-weight:600;font-size:14px}
.sort::after{content:"";position:absolute;right:16px;top:15px;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--chip);gap:2px}
.seg button{height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.filters{position:sticky;top:86px;max-height:calc(100vh - 106px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.filters-head{display:none}
.filters-body{overflow-y:auto;padding:6px 20px 20px;overscroll-behavior:contain}
.fgroup{padding-block:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.fgroup:last-child{border-bottom:0}
.fgroup h4{font-weight:600;font-size:15px}
.fgroup .chip{min-height:34px;padding:0 12px;font-size:13.5px}
.input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);padding:0 14px;font-size:15px;outline:none}
.input:focus{border-color:var(--lacquer);background:var(--surface)}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:vertical}
.price-vals{display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.range{position:relative;height:28px}
.range input{position:absolute;inset:0;width:100%;appearance:none;-webkit-appearance:none;background:none;pointer-events:none;margin:0}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--lacquer);box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--lacquer);cursor:grab}
.range-track{position:absolute;left:12px;right:12px;top:12px;height:4px;border-radius:2px;background:var(--line)}
.range-fill{position:absolute;top:0;bottom:0;background:var(--lacquer);border-radius:2px}
.check{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;cursor:pointer}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background-color .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+i{background:var(--lacquer)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--lacquer);outline-offset:2px}
.filters-foot{display:none}
.results{display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.sheet-backdrop{position:fixed;inset:0;background:var(--veil);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
@media (max-width:900px){
  .search-grid{grid-template-columns:1fr}
  .filters{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:61;max-height:88vh;border-radius:26px 26px 0 0;border:0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .filters.open{transform:none}
  .filters-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 20px;position:relative}
  .filters-head::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  .filters-foot{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
  .filters-foot .btn-primary{flex:1}
}
/* map */
.map{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--sunk);aspect-ratio:10/7;max-width:100%}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:2}
.pin b{height:30px;padding:0 10px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.18);white-space:nowrap;font-variant-numeric:tabular-nums;transition:background-color .15s,transform .15s}
.pin i{width:10px;height:10px;transform:rotate(45deg) translateY(-6px);background:var(--surface);margin-bottom:-4px}
.pin.on{z-index:3}
.pin.on b,.pin:hover b{background:var(--lacquer);color:var(--on-lacquer);transform:scale(1.06)}
.pin.on i,.pin:hover i{background:var(--lacquer)}
.me-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#3D7BFF;border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 8px rgba(61,123,255,.18)}
.map-pop{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;background:var(--surface);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:grid;grid-template-columns:104px minmax(0,1fr);overflow:hidden;max-width:460px}
.map-pop .ph{position:relative;background:var(--nude)}
.map-pop .ph>svg{position:absolute;inset:0;width:100%;height:100%}
.map-pop .bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.map-pop .x{position:absolute;top:8px;right:8px}
@media (max-width:720px){.map{aspect-ratio:3/4}}

/* ---------- profile ---------- */
.cover{position:relative;height:clamp(180px,26vw,300px);border-radius:0 0 var(--r-xl) var(--r-xl);overflow:hidden;background:var(--nude);max-width:1240px;margin-inline:auto}
.cover>svg{width:100%;height:100%;display:block}
.back{position:absolute;top:14px;left:14px;height:40px;padding:0 14px 0 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#2A1220;font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.p-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.p-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.p-head{display:flex;gap:20px;align-items:flex-end;padding-top:14px;position:relative;flex-wrap:wrap}
.p-head .ava.lg{margin-top:-62px}
.p-head .t{display:flex;flex-direction:column;gap:6px;padding-bottom:4px;min-width:0;flex:1}
.p-head h1{font-family:var(--f-display);font-size:clamp(30px,4vw,44px);line-height:1.05}
.p-actions{display:flex;gap:8px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badges .tag{background:var(--surface);border:1px solid var(--line)}
.p-sec{padding-block:30px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.p-sec:last-child{border-bottom:0}
.p-sec .about{max-width:62ch;font-size:16px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.facts b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}
.pf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pf-grid button{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative}
.pf-grid button svg{width:100%;height:100%;display:block;transition:transform .35s ease}
.pf-grid button:hover svg{transform:scale(1.05)}
@media (max-width:720px){.pf-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.pf-grid button{border-radius:10px}.facts b{font-size:17px}}
.svc-table{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.svc-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.svc-row:first-child{border-top:0}
.svc-row.hd{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:600;padding-block:10px}
.svc-row .nm b{font-weight:600;display:block}
.svc-row .nm span{font-size:13px;color:var(--muted)}
.svc-row .pr{font-weight:700;font-variant-numeric:tabular-nums}
.svc-row .du{color:var(--muted);font-variant-numeric:tabular-nums}
.svc-row.sel{background:color-mix(in srgb,var(--lacquer) 7%,var(--surface))}
@media (max-width:620px){.svc-row{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}.svc-row .pr,.svc-row .du{grid-column:1;font-size:14px}.svc-row .du{display:none}.svc-row .act{grid-column:2;grid-row:1/3}.svc-row.hd{display:none}}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:64px;height:76px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.day small{font-size:12px;color:var(--muted);font-weight:500}
.day b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.day i{width:5px;height:5px;border-radius:50%;background:var(--good);margin-top:3px}
.day.none i{background:var(--line)}
.day.off{opacity:.45}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.on small{color:inherit;opacity:.75}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.slot{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.slot small{font-size:10.5px;font-weight:600;opacity:.8}
.slot.free{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.slot.free:hover{border-color:var(--good);background:var(--good-bg)}
.slot.on{background:var(--lacquer);border-color:var(--lacquer);color:var(--on-lacquer)}
.slot.busy{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);color:var(--muted);cursor:not-allowed}
.slot.na,.slot.past,.slot.break{color:var(--muted);opacity:.5;cursor:not-allowed;border-style:dashed}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.legend .lf{border-color:var(--good);background:var(--good-bg)}
.legend .lb{background:repeating-linear-gradient(135deg,var(--sunk) 0 3px,var(--surface) 3px 6px)}
.legend .ln{border-style:dashed;opacity:.6}
.rating-sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.rating-sum .big{font-family:var(--f-display);font-size:56px;line-height:1}
.bars{display:grid;gap:6px}
.bars div{display:grid;grid-template-columns:14px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars span.b{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bars span.b i{display:block;height:100%;background:#E0A100;border-radius:3px}
.review{display:flex;flex-direction:column;gap:10px;padding-block:18px;border-top:1px solid var(--line)}
.review .top-r{display:flex;align-items:center;gap:10px}
.review .reply{margin-left:16px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:14.5px}
.review .reply b{display:block;font-size:13px;margin-bottom:2px}
.minimap{position:relative;height:200px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.minimap svg{position:absolute;inset:0;width:100%;height:100%}
.cond{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.cond li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.cond li svg{color:var(--good);margin-top:2px}
.book-card{position:sticky;top:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);margin-top:24px}
.book-card .sv{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:14.5px}
.mbar{display:none}
@media (max-width:900px){
  .p-grid{grid-template-columns:1fr}
  .p-aside{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:44;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .mbar .btn{flex:1;max-width:240px}
  body.has-mbar main{padding-bottom:110px}
  body.has-mbar .tabbar{display:none}
  .p-head{gap:14px}.p-head .ava.lg{margin-top:-54px}
  .ava.lg{width:84px;height:84px;font-size:30px}
}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:var(--veil);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.dialog{width:min(620px,100%);max-height:min(860px,calc(100vh - 40px));background:var(--bg);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.2,.8,.2,1)}
.dialog.sm{width:min(440px,100%)}
@keyframes pop{from{transform:translateY(16px) scale(.98);opacity:0}}
.dlg-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.dlg-head .t{flex:1;min-width:0}
.dlg-body{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
.dlg-body>*{flex-shrink:0}
.dlg-head,.dlg-foot,.steps{flex:none}
.dlg-foot{padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:center}
.dlg-foot .btn-primary{flex:1}
@media (max-width:720px){
  .modal{padding:0;place-items:end stretch}
  .dialog,.dialog.sm{width:100%;max-height:94vh;border-radius:26px 26px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 22px 14px;background:var(--surface)}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.steps div i{height:4px;border-radius:2px;background:var(--line)}
.steps div.on{color:var(--ink)}
.steps div.on i,.steps div.sdone i{background:var(--lacquer)}
@media (max-width:520px){.steps div span{display:none}}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%;transition:border-color .15s}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--lacquer);background:color-mix(in srgb,var(--lacquer) 6%,var(--surface))}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.on .rd{border-color:var(--lacquer)}
.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--lacquer)}
.opt .nm{flex:1;min-width:0}
.opt .nm b{display:block;font-weight:600}
.opt .nm span{font-size:13.5px;color:var(--muted)}
.opt .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.opts{display:grid;gap:8px}
.lbl{font-size:13.5px;font-weight:600;margin-bottom:6px;display:block}
.hold{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;font-weight:600}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.summary div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-top:1px solid var(--line);font-size:15px}
.summary div:first-child{border-top:0}
.summary div span{color:var(--muted)}
.summary div b{text-align:right;font-weight:600}
.summary .total{background:var(--sunk);font-size:17px}
.slot-group h4{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.uploads{display:flex;gap:8px;flex-wrap:wrap}
.uploads img,.up-add{width:72px;height:72px;border-radius:14px;object-fit:cover}
.up-add{border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);position:relative;cursor:pointer}
.up-add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--line)}
.stars button.on{color:#E0A100}
.stars svg{width:30px;height:30px}
.code-in{display:flex;gap:10px}
.code-in input{width:56px;height:62px;text-align:center;font-size:24px;font-weight:700;border-radius:16px;border:1px solid var(--line);background:var(--sunk);outline:none}
.code-in input:focus{border-color:var(--lacquer);background:var(--surface)}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:14px;padding:10px 14px}

/* lightbox */
.lbox{position:fixed;inset:0;z-index:90;background:rgba(18,8,13,.94);display:flex;flex-direction:column;animation:fade .2s}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#fff}
.lb-top .icon-btn{color:#fff}
.lb-top .icon-btn:hover{background:rgba(255,255,255,.12)}
.lb-stage{flex:1;display:grid;place-items:center;padding:0 16px;min-height:0;position:relative}
.lb-stage svg{width:min(88vh,100%);max-height:100%;aspect-ratio:1;border-radius:20px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.lb-nav:hover{background:rgba(255,255,255,.24)}
.lb-cap{color:#fff;text-align:center;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;align-items:center}
.lb-cap span{color:rgba(255,255,255,.65);font-size:14px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:100;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:901px){.toast{bottom:28px}}

/* ---------- done ---------- */
.done-page{max-width:640px;margin-inline:auto;padding-block:36px 40px;display:flex;flex-direction:column;gap:22px}
.done-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.done-hero .seal{width:84px;height:84px;border-radius:50%;background:var(--lacquer);color:var(--on-lacquer);display:grid;place-items:center;box-shadow:0 16px 30px -14px var(--lacquer);background-image:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 60%);animation:seal .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes seal{from{transform:scale(.4);opacity:0}}
.done-hero .seal svg{width:40px;height:40px}
.done-hero h1{font-family:var(--f-display);font-size:clamp(36px,6vw,52px);line-height:1}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden}
.ticket-top{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;padding:18px 20px;border-bottom:2px dashed var(--line);position:relative}
.ticket-top::before,.ticket-top::after{content:"";position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.ticket-top::before{left:-11px}.ticket-top::after{right:-11px}
.ticket .summary{border:0;border-radius:0}
.done-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm-box{background:var(--bad-bg);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:12px}

/* ---------- cabinet ---------- */
.cab{padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}
.cab-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:66px;background:var(--bg);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:46px;padding:0 14px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{color:var(--ink);border-color:var(--lacquer)}
.tabs .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--chip);font-size:12px;display:grid;place-items:center}
@media (max-width:900px){.tabs{top:60px}}
.bk-list{display:flex;flex-direction:column;gap:10px}
.bk{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.bk .date{width:64px;height:68px;border-radius:14px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.bk .date b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.bk .date span{font-size:12px;color:var(--muted)}
.bk .info{display:flex;flex-direction:column;gap:4px;min-width:0}
.bk .info .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk .info b{font-weight:600}
.bk .info .l2{font-size:14px;color:var(--muted)}
.bk .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:720px){.bk{grid-template-columns:56px minmax(0,1fr)}.bk .date{width:56px;height:60px}.bk .acts{grid-column:1/-1;justify-content:stretch}.bk .acts .btn{flex:1}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-weight:600;font-size:17px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:13.5px;color:var(--muted)}
.kpi b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--good)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:first-child{grid-column:1/-1}}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:56px 14px minmax(0,1fr) auto;gap:12px;align-items:start;padding-block:10px}
.tl time{font-weight:700;font-variant-numeric:tabular-nums;padding-top:1px}
.tl .dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--lacquer);margin-top:5px;position:relative}
.tl .dot::after{content:"";position:absolute;left:50%;top:12px;width:2px;height:44px;background:var(--line);transform:translateX(-50%)}
.tl:last-child .dot::after{display:none}
.tl.brk .dot{border-color:var(--line)}
.tl.blk .dot{border-color:var(--muted)}
.tl .who2 b{font-weight:600;display:block}
.tl .who2 span{font-size:13.5px;color:var(--muted)}
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.cal{display:grid;min-width:760px;position:relative}
.cal-h{position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line);padding:10px 8px;text-align:center;font-size:13px;font-weight:600}
.cal-h small{display:block;color:var(--muted);font-weight:500}
.cal-h.today{color:var(--lacquer)}
.cal-hours{border-right:1px solid var(--line)}
.cal-hours div{height:48px;font-size:11.5px;color:var(--muted);text-align:right;padding:2px 8px 0 0;font-variant-numeric:tabular-nums}
.cal-col{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px}
.cal-col:last-child{border-right:0}
.cal-col.off{background-color:var(--sunk)}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--lacquer) 14%,var(--surface));border-left:3px solid var(--lacquer);text-align:left}
.ev b{display:block;font-weight:700;font-size:12px}
.ev.pending{background:var(--warn-bg);border-left-color:var(--warn)}
.ev.own{background:var(--info-bg);border-left-color:var(--info)}
.ev.brk{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);border-left-color:var(--line);color:var(--muted)}
.ev.blk{background:var(--chip);border-left-color:var(--muted);color:var(--muted)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month .mh{font-size:12.5px;color:var(--muted);text-align:center;font-weight:600}
.month .md{aspect-ratio:1;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;font-weight:600;min-width:0}
.month .md.off{background:var(--sunk);color:var(--muted)}
.month .md.today{border-color:var(--lacquer)}
.month .md i{font-style:normal;font-size:11px;font-weight:600;color:var(--lacquer)}
.month .md.blank{visibility:hidden}
.wd-toggle{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd-toggle button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.wd-toggle button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--sunk);font-size:14.5px}
.ex-row .grow{flex:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:12px 14px;background:var(--sunk);white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:14px}
.hbar .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px;background:var(--lacquer)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:620px){.hbar{grid-template-columns:110px minmax(0,1fr) 42px}}
.spark svg{width:100%;height:120px;display:block}
.avatar-edit{display:flex;align-items:center;gap:16px}
.mod-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);flex-wrap:wrap}
.mod-item .grow{flex:1;min-width:180px}
</style>

<script>
(()=>{'use strict';
/* ================= utils ================= */

const store={get(k,d){try{const v=localStorage.getItem('ns2_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ns2_'+k,JSON.stringify(v))}catch(e){}}};

const TODAY=new Date();TODAY.setHours(0,0,0,0);
const addD=i=>{const d=new Date(TODAY);d.setDate(d.getDate()+i);return d};

const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const idxOf=k=>Math.round((parseKey(k)-TODAY)/864e5);
const WD=['вс','пн','вт','ср','чт','пт','сб'];

const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
function dayLabel(k,long){const i=idxOf(k),d=parseKey(k);if(i===0)return 'Сегодня';if(i===1)return 'Завтра';if(i===-1)return 'Вчера';return (long?WDF[d.getDay()]+', ':WD[d.getDay()]+', ')+d.getDate()+' '+MON[d.getMonth()]}
function dayFull(k){const d=parseKey(k);const i=idxOf(k);const pre=i===0?'сегодня, ':i===1?'завтра, ':'';return pre+d.getDate()+' '+MON[d.getMonth()]+', '+WD[d.getDay()]}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const overl=(s,e,list)=>list.some(b=>s<b.e&&e>b.s);
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function lum(h){const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);return .2126*r+.7152*g+.0722*b}

/* ================= icons ================= */
const I={
 search:'<path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm9 16-4.2-4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',

/* ================= nail art generator ================= */
let UID=0;
const SHAPE={
 almond:'M30 0C50 6 60 34 60 62V90Q60 100 50 100H10Q0 100 0 90V62C0 34 10 6 30 0Z',
 oval:'M30 2C48 2 60 18 60 38V90Q60 100 50 100H10Q0 100 0 90V38C0 18 12 2 30 2Z',
 square:'M7 8H53Q60 8 60 15V90Q60 100 50 100H10Q0 100 0 90V15Q0 8 7 8Z',

};
const SHAPE_N={almond:'миндаль',oval:'овал',square:'квадрат',stiletto:'стилет'};
const STY={
 nude:{n:'Нюд',type:'solid',pal:[['#E7C3B3'],['#D6A898'],['#EED5CB'],['#C99686']]},
 french:{n:'Френч',type:'french',pal:[['#F2DDD6','#FFFFFF'],['#F0D3CB','#B0103F'],['#EAD0C5','#1E1418']]},
 chrome:{n:'Хром',type:'chrome',pal:[['#C3C1D3'],['#E2BFCD'],['#CBB079']]},
 ombre:{n:'Омбре',type:'ombre',pal:[['#F6D5DF','#C2185B'],['#F2DED7','#8E5A7C'],['#DCE7F3','#3F649C']]},
 cat:{n:'Кошачий глаз',type:'cat',pal:[['#3B0A1E','#FF8AB0'],['#1D1A2F','#B8A6FF'],['#1D2E28','#9EE6C0']]},
 art:{n:'Рисунки',type:'art',pal:[['#F7E4E8','#B0103F'],['#EFE6DC','#2A1220'],['#E6EDF7','#E05476']]},
 marble:{n:'Мрамор',type:'marble',pal:[['#F3EFEE','#8D8189'],['#EFE3E8','#B9934C'],['#E4ECE9','#55766B']]},
 minimal:{n:'Минимализм',type:'lines',pal:[['#F0DED7','#2A1220'],['#E7CFC6','#B9934C'],['#F4EAE6','#B0103F']]},

const STY_KEYS=Object.keys(STY);
function heartP(x,y,k,c){return `<path transform="translate(${x} ${y}) scale(${k})" d="M6 11C2 8 0 6 0 3.5 0 1.5 1.5 0 3.3 0 4.5 0 5.4.6 6 1.6 6.6.6 7.5 0 8.7 0 10.5 0 12 1.5 12 3.5 12 6 10 8 6 11Z" fill="${c}"/>`}
function flowerP(x,y,r,c,cc){let s='';for(let k=0;k<5;k++){const a=(k*72-90)*Math.PI/180;s+=`<circle cx="${(x+Math.cos(a)*r).toFixed(1)}" cy="${(y+Math.sin(a)*r).toFixed(1)}" r="${(r*.78).toFixed(1)}" fill="${c}"/>`}return s+`<circle cx="${x}" cy="${y}" r="${(r*.55).toFixed(1)}" fill="${cc}"/>`}
function tip(type,c,i,shape){
 const u=++UID,d=SHAPE[shape]||SHAPE.almond,a=c[0],b=c[1]||'#ffffff';let s='',defs='';
 const R=f=>`<rect x="-6" y="-12" width="72" height="118" fill="${f}"/>`;
 switch(type){
  case 'french':s=R(a)+`<path d="M-6 ${32+(i%2)*3}Q30 ${10+(i%3)*3} 66 ${32+(i%2)*3}V-12H-6Z" fill="${b}"/>`;break;
  case 'ombre':defs=`<linearGradient id="g${u}" x1="0" y1="0" x2="0" y2="1"><stop offset=".02" stop-color="${b}"/><stop offset=".85" stop-color="${a}"/></linearGradient>`;s=R(`url(#g${u})`);break;
  case 'chrome':defs=`<linearGradient id="g${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mix(a,'#ffffff',.55)}"/><stop offset=".34" stop-color="${a}"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".64" stop-color="${mix(a,'#000000',.2)}"/><stop offset="1" stop-color="${mix(a,'#ffffff',.35)}"/></linearGradient>`;s=R(`url(#g${u})`);break;

 const r=rng(hash(m.id+'|'+key));
 const gen=[];const n=1+Math.floor(r()*4);const idx=idxOf(key);
 for(let k=0;k<20&&gen.length<n;k++){
  const svcK=pick(r,Object.keys(m.svc).filter(x=>!SVM[x].addon));const dur=SVM[svcK].d;
  const slots=Math.floor((en-st-dur)/30)+1;if(slots<1)continue;
  const s=st+Math.floor(r()*slots)*30,e=s+dur;
  if(overl(s,e,gen)||overl(s,e,own)||overl(s,e,blocks)||(br&&s<br[1]&&e>br[0]))continue;
  gen.push({s,e,gen:true,svc:svcK,name:pick(r,CLIENTS),status:idx>1&&r()<.25?'pending':'confirmed',price:m.svc[svcK],comment:r()<.3?pick(r,['Хочу как на фото в профиле','Снять старое покрытие','Нужен короткий квадрат','Первый раз, подскажите форму']):''});
 }
 const busy=[...gen,...own,...blocks].sort((a,b)=>a.s-b.s);
 const res={st,en,br,busy};
 if(m.id!==1)SC[ck]=res;
 return res;
}
function slots(m,key,dur){
 const sc=sched(m,key);if(sc.off)return {off:true,reason:sc.reason,list:[]};
 const today=key===dk(0),now=nowMin(),list=[];
 for(let t=sc.st;t+30<=sc.en;t+=30){
  let st='free';
  const inBusy=sc.busy.find(b=>t>=b.s&&t<b.e);
  if(today&&t<now+30)st='past';
  else if(inBusy)st='busy';
  else if(sc.br&&t>=sc.br[0]&&t<sc.br[1])st='break';
  else if(t+dur>sc.en||overl(t,t+dur,sc.busy)||(sc.br&&t<sc.br[1]&&t+dur>sc.br[0]))st='na';
  list.push({t,st});
 }
 return {list,sc};
}
function freeSlots(m,key,dur){const s=slots(m,key,dur);return s.off?[]:s.list.filter(x=>x.st==='free').map(x=>x.t)}
function nextFree(m,dur){for(let i=0;i<21;i++){const k=dk(i);const f=freeSlots(m,k,dur);if(f.length)return {i,key:k,t:f[0],all:f}}return null}
const minDur=m=>Math.min(...Object.keys(m.svc).filter(k=>!SVM[k].addon&&k!=="removal").map(k=>SVM[k].d));
function nextTxt(nf){if(!nf)return 'нет мест на 3 недели';return (nf.i===0?'сегодня':nf.i===1?'завтра':dayLabel(nf.key).toLowerCase())+' в '+fmtT(nf.t)}

/* ================= search logic ================= */
const TW={morning:[540,720,'Утро','9–12'],day:[720,1020,'День','12–17'],evening:[1020,1320,'Вечер','17–22']};
function fDays(){const f=S.f;if(f.date==='today')return [0];if(f.date==='tomorrow')return [1];if(f.date==='near')return [0,1,2];if(f.date==='pick'&&f.dateKey)return [idxOf(f.dateKey)];return null}
function fWin(){const f=S.f;if(f.time==='custom')return [f.tfrom,f.tto];if(TW[f.time])return TW[f.time];return null}
function hasFreeIn(m,days,win,dur){for(const i of days){if(i<0)continue;const fr=freeSlots(m,dk(i),dur);if(fr.some(t=>!win||(t>=win[0]&&t<win[1])))return true}return false}
function matches(m){
 const f=S.f;const dur=f.svc?SVM[f.svc].d:minDur(m);
 if(f.district.length&&!f.district.includes(m.district))return false;
 if(f.q){const q=f.q.toLowerCase().trim();if(q&&!(m.metro+' '+m.addr+' '+m.district+' '+m.name).toLowerCase().includes(q))return false}
 if(f.svc&&!m.svc[f.svc])return false;
 const p=priceFor(m,f.svc);if(p<f.pmin||p>f.pmax)return false;
 if(m.rating<f.rating)return false;
 if(f.styles.length&&!f.styles.some(s=>m.styles.includes(s)))return false;
 if(f.format.length&&!f.format.includes(m.format))return false;
 const ex=f.extras;
 if(ex.includes('today')&&!hasFreeIn(m,[0],null,dur))return false;
 if(ex.includes('newC')&&!m.newC)return false;
 if(ex.includes('online')&&!m.online)return false;
 if(ex.includes('auto')&&!m.auto)return false;
 if(ex.includes('complex')&&!m.complex)return false;
 if(ex.includes('art')&&!m.styles.includes('art'))return false;
 const days=fDays(),win=fWin();
 if((days||win)&&!hasFreeIn(m,days||[0,1,2,3,4,5,6],win,dur))return false;
 return true;
}
function score(m){const f=S.f;const nf=nextFree(m,f.svc?SVM[f.svc].d:minDur(m));let s=m.rating*1.4+Math.log10(m.reviews)*.9-m.km*.12+m.fill*.6;if(f.svc&&m.svc[f.svc])s+=2;if(nf)s+=nf.i===0?1.4:nf.i<3?.7:0;return s}
function results(){
 const list=M.filter(matches);const f=S.f;
 const nfAbs=m=>{const n=nextFree(m,f.svc?SVM[f.svc].d:minDur(m));return n?n.i*1440+n.t:1e9};
 const cmp={rel:(a,b)=>score(b)-score(a),cheap:(a,b)=>priceFor(a,f.svc)-priceFor(b,f.svc),exp:(a,b)=>priceFor(b,f.svc)-priceFor(a,f.svc),dist:(a,b)=>a.km-b.km,time:(a,b)=>nfAbs(a)-nfAbs(b),rating:(a,b)=>b.rating-a.rating};
 return list.sort(cmp[S.sort]);
}
function activeCount(){const f=S.f;let n=0;if(f.district.length)n++;if(f.q)n++;if(f.svc)n++;if(f.pmin>500||f.pmax<6000)n++;if(f.date!=='any')n++;if(f.time!=='any')n++;if(f.rating)n++;n+=f.styles.length?1:0;n+=f.format.length?1:0;n+=f.extras.length;return n}

  ${s.off?`<div class="empty" style="padding:22px"><b>${s.reason}</b><span class="muted small">Выберите другой день</span></div>`:fr.length?groups.filter(g=>g[1].length).map(([n,ts])=>`<div class="slot-group"><h4>${n}</h4><div class="slot-grid">${ts.map(t=>`<button class="slot free ${b.t===t?'on':''}" data-act="bk-slot" data-t="${t}" aria-pressed="${b.t===t}">${fmtT(t)}</button>`).join('')}</div></div>`).join(''):`<div class="empty" style="padding:22px"><b>На этот день всё занято</b><span class="muted small">Попробуйте соседние даты, зелёная точка значит, что окна есть.</span></div>`}
  ${b.t!=null?holdHTML(holdLeft):''}`;
 }else if(b.step===3){
  body=`${holdHTML(holdLeft)}
  <div><label class="lbl" for="bk-name">Имя</label><input class="input" id="bk-name" data-f="bk-name" value="${esc(b.name)}" autocomplete="given-name" placeholder="Как к вам обращаться"></div>
  <div><label class="lbl" for="bk-phone">Телефон</label><input class="input" id="bk-phone" data-f="bk-phone" value="${esc(b.phone)}" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__"><p class="muted small" style="margin-top:6px">Пришлём подтверждение и напомним за 24 часа</p></div>
  <div><span class="lbl">Пожелания</span><div class="chips">${['Снять старое покрытие','Укрепление','Короткая длина','Хочу как на фото','Первый раз у мастера'].map(w=>`<button class="chip ${b.wishes.includes(w)?'on':''}" data-act="bk-wish" data-v="${w}">${w}</button>`).join('')}</div></div>
  <div><label class="lbl" for="bk-cm">Комментарий мастеру <span class="muted" style="font-weight:400">— необязательно</span></label><textarea class="input" id="bk-cm" data-f="bk-comment" placeholder="Например: нужен дизайн как на третьей фотографии в портфолио">${esc(b.comment)}</textarea></div>

 }else if(b.step===4){

   ${[['place','Оплата на месте','Наличными, картой или по СБП после визита',''],['online','Онлайн-оплата','Картой или через СБП сейчас, чек придёт на почту',rub(priceBk())],['prepay',`Предоплата ${m.prepay||30} %`,m.prepay?'Мастер берёт предоплату, она входит в стоимость':'Этот мастер не берёт предоплату',m.prepay?rub(pre):'']].map(([k,n,d,pr])=>`<button class="opt ${b.pay===k?'on':''}" data-act="bk-pay" data-v="${k}" role="radio" aria-checked="${b.pay===k}" ${k==='prepay'&&!m.prepay?'disabled':''}><span class="rd"></span><span class="nm"><b>${n}</b><span>${d}</span></span><span class="pr">${pr}</span></button>`).join('')}</div>

 }else{

 }
 const steps=`<div class="steps">${BSTEPS.map((n,i)=>`<div class="${i+1===b.step?'on':i+1<b.step?'sdone':''}"><i></i><span>${n}</span></div>`).join('')}</div>`;
 const html=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="bk-title">
  <div class="dlg-head">${ava(m,'sm')}<div class="t"><b id="bk-title">${b.editId?'Перенос записи, ':''}${m.name}</b><div class="small muted">Шаг ${b.step} из 5: ${BSTEPS[b.step-1]}${b.step>1?`, ${SVM[b.svc].n.toLowerCase()}, ${rub(priceBk())}`:''}</div></div><button class="icon-btn" data-act="modal-close" aria-label="Закрыть">${ic('x')}</button></div>

  <div class="dlg-foot">${b.step>1?`<button class="btn btn-soft" data-act="bk-back">Назад</button>`:''}<button class="btn btn-primary" data-act="${b.step===5?'bk-confirm':'bk-next'}" ${bkValid()?'':'disabled'} id="bk-next">${b.step===5?(b.editId?'Сохранить изменения':'Подтвердить запись'):b.step===2&&b.t!=null?`Далее: ${fmtT(b.t)}, ${dayLabel(b.day).toLowerCase()}`:'Далее'}</button></div>
 </div>`;

function holdHTML(left){return `<div class="hold" id="hold">${ic('clock')}<span>Держим ${fmtT(S.bk.t)} за вами ещё <b class="num" id="hold-t">${fmtHold(left)}</b>, пока вы оформляете запись</span></div>`}
const fmtHold=ms=>{const s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)};
function sumRows(m,b){const payN={place:'на месте',online:'онлайн',prepay:'предоплата'}[b.pay];return `<div><span>Мастер</span><b>${m.name}</b></div><div><span>Услуга</span><b>${SVM[b.svc].n}${b.design?' + дизайн':''}</b></div><div><span>Дата</span><b>${dayFull(b.day)}</b></div><div><span>Время</span><b class="num">${fmtT(b.t)}–${fmtT(b.t+b.dur)}</b></div><div><span>Длительность</span><b>${b.dur} мин</b></div><div><span>Адрес</span><b>${m.addr}</b></div><div><span>Оплата</span><b>${payN}</b></div><div class="total"><span>Стоимость</span><b class="num">${rub(b.price)}</b></div>`}
function bkConfirm(){
 const b=S.bk,m=MM[b.mid];
 if(b.editId){const x=S.bookings.find(y=>y.id===b.editId);Object.assign(x,{svc:b.svc,design:b.design,day:b.day,t:b.t,pay:b.pay,dur:durBk(),price:priceBk(),status:m.auto?'confirmed':'pending',name:b.name,phone:b.phone,comment:[...b.wishes,b.comment].filter(Boolean).join('; ')});save();closeModal();toast('Запись перенесена');go('done',{id:x.id});return}
 const id='NS-'+(48400+Math.floor(Math.random()*9000));
 S.bookings.unshift({id,mid:m.id,svc:b.svc,design:b.design,day:b.day,t:b.t,dur:durBk(),price:priceBk(),status:m.auto?'confirmed':'pending',pay:b.pay,name:b.name,phone:b.phone,comment:[...b.wishes,b.comment].filter(Boolean).join('; ')});
 if(!S.user)S.user={name:b.name,phone:b.phone,email:''};
 save();closeModal();go('done',{id});
}

V.done=()=>{
 const b=S.bookings.find(x=>x.id===S.params.id);if(!b)return V.home();const m=MM[b.mid];
 const st=STATUS[b.status];const cancelled=b.status.startsWith('cancel');
 return `<div class="wrap"><div class="done-page">
  <div class="done-hero">${cancelled?`<h1>Запись отменена</h1><p class="muted">Мастер получил уведомление. Время снова доступно другим.</p>`:`<div class="seal">${ic('check')}</div><h1>Вы записаны!</h1><p class="muted">${b.status==='pending'?'Мастер подтвердит запись в течение часа, мы пришлём уведомление.':'Напомним за 24 часа и за 2 часа до визита.'}</p>`}</div>
  <div class="ticket"><div class="ticket-top">${ava(m)}<div style="flex:1;min-width:150px"><b class="display" style="font-size:20px">${m.name}</b><div class="small muted" style="white-space:nowrap">Запись № <span class="num">${b.id}</span></div></div><span class="pill ${st[1]}">${st[0]}</span></div>
   <div class="summary">${sumRows(m,b)}</div></div>
  ${cancelled?`<div class="done-actions"><button class="btn btn-primary" data-act="open" data-id="${m.id}">Записаться снова</button><button class="btn btn-soft" data-act="go" data-r="me" data-tab="bookings">Мои записи</button></div>`:`<div class="done-actions"><button class="btn btn-line" data-act="bk-edit" data-id="${b.id}">Изменить запись</button><button class="btn btn-line btn-danger" data-act="bk-cancel" data-id="${b.id}">Отменить запись</button></div>
  <div id="cancel-box"></div>
  <button class="btn btn-soft" data-act="go" data-r="me" data-tab="bookings">Перейти в мои записи</button>`}

const STATUS={pending:['Ожидает подтверждения','warn'],confirmed:['Подтверждена','good'],completed:['Завершена','done'],cancel_client:['Отменена клиентом','bad'],cancel_master:['Отменена мастером','bad'],noshow:['Неявка','bad']};

V.me=()=>{

 const canc=S.bookings.filter(b=>b.status.startsWith('cancel')).sort((a,b)=>b.day.localeCompare(a.day));

  <h3 class="h3">Ваши отзывы</h3>
  ${S.myReviews.length?S.myReviews.map(r=>{const m=MM[r.mid];return `<article class="panel"><div class="rate">${ava(m,'sm')}<b>${m.name}</b><span class="star">${'★'.repeat(r.rating)}</span><span class="muted small">${dayFull(r.day)}</span></div><p>${esc(r.text)}</p>${r.photos.length?`<div class="uploads">${r.photos.map(p=>`<img src="${p}" alt="Фото к отзыву">`).join('')}</div>`:''}</article>`}).join(''):'<p class="muted">Вы ещё не оставляли отзывов.</p>'}`;
 }else{
  const n=S.notif;
  body=`<div class="grid2"><div class="panel"><h3>Профиль</h3>
   <div class="avatar-edit">${u.avatar?`<span class="ava lg" style="box-shadow:none"><img src="${u.avatar}" alt="Аватар"></span>`:`<span class="ava lg" style="--h:330;box-shadow:none">${esc((u.name||'Г')[0])}</span>`}<label class="btn btn-soft btn-sm" style="position:relative">Загрузить фото<input type="file" accept="image/*" data-f="avatar" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></div>

   ${[['remind','Напоминание за 24 часа'],['promo','Скидки и новые мастера рядом']].map(([k,t])=>`<label class="check"><span>${t}</span><span class="switch"><input type="checkbox" data-f="notif" value="${k}" ${n[k]?'checked':''}><i></i></span></label>`).join('')}

function bkRow(b,seg){
 const m=MM[b.mid];const d=parseKey(b.day);let st=STATUS[b.status];
 if(seg==='past'&&['pending','confirmed'].includes(b.status))st=STATUS.completed;
 let acts='';
 if(seg==='up')acts=`<button class="btn btn-soft btn-sm" data-act="go" data-r="done" data-id="${b.id}">Подробнее</button><button class="btn btn-line btn-sm" data-act="bk-edit" data-id="${b.id}">Перенести</button><button class="btn btn-line btn-sm btn-danger" data-act="bk-cancel-quick" data-id="${b.id}">Отменить</button>`;
 else if(seg==='past')acts=`${b.status==='completed'&&!b.reviewed?`<button class="btn btn-primary btn-sm" data-act="rev-open" data-id="${b.id}">Оставить отзыв</button>`:''}<button class="btn btn-soft btn-sm" data-act="book" data-id="${m.id}" data-svc="${b.svc}">Записаться снова</button>`;
 else acts=`<button class="btn btn-soft btn-sm" data-act="book" data-id="${m.id}" data-svc="${b.svc}">Записаться снова</button>`;
 return `<article class="bk"><div class="date"><b>${d.getDate()}</b><span>${MONS[d.getMonth()]}, ${WD[d.getDay()]}</span></div>
  <div class="info"><div class="l1"><b>${SVM[b.svc].n}${b.design?' + дизайн':''}</b><span class="pill ${st[1]}">${st[0]}</span></div>
  <div class="l2"><button data-act="open" data-id="${m.id}" style="text-decoration:underline">${m.name}</button>, <span class="num">${fmtT(b.t)}</span>, ${rub(b.price)}</div></div>
  <div class="acts">${acts}</div></article>`;
}

/* ---------- master cabinet (ТЗ §11-12) ---------- */
const ME=MM[1];
function mBookings(from,to){
 const out=[];
 for(let i=from;i<=to;i++){const k=dk(i);const sc=sched(ME,k);if(sc.off)continue;
  sc.busy.filter(b=>!b.block).forEach(b=>{const key=k+'|'+b.s;let status=b.own?S.bookings.find(x=>x.id===b.bid).status:(S.mo[key]||b.status);if(!b.own&&i<0&&status==='confirmed')status='completed';
   if(status.startsWith('cancel'))return;out.push({key,day:k,i,s:b.s,e:b.e,svc:b.svc,name:b.own?(b.name+' (вы, демо)'):b.name,own:b.own,bid:b.bid,status,price:b.price,comment:b.comment})})}
 return out;
}
function mSet(bk,status){if(bk.own){const x=S.bookings.find(y=>y.id===bk.bid);x.status=status}else S.mo[bk.key]=status;save()}

 let body='';
 if(tab==='dash'){
  const rev=week.reduce((s,b)=>s+b.price,0);
  const sc=sched(ME,dk(0));
  const items=sc.off?[]:[...today.map(b=>({...b,k:'bk'})),...(sc.br?[{s:sc.br[0],e:sc.br[1],k:'brk'}]:[]),...sc.busy.filter(b=>b.block).map(b=>({...b,k:'blk'}))].sort((a,b)=>a.s-b.s);
  body=`<div class="kpis"><div class="kpi"><span>Записи сегодня</span><b>${today.length}</b><em>${today.filter(b=>b.status==='pending').length?today.filter(b=>b.status==='pending').length+' ждут подтверждения':'все подтверждены'}</em></div><div class="kpi"><span>На неделю</span><b>${week.length}</b><em>+4 к прошлой</em></div><div class="kpi"><span>Выручка за неделю</span><b>${(rev/1000).toFixed(1).replace('.',',')}к</b><em>${rub(rev)}</em></div><div class="kpi"><span>Клиентов всего</span><b>112</b><em>+9 за месяц</em></div><div class="kpi"><span>Новые отзывы</span><b>3</b><em>средняя 4,9</em></div></div>

function calHTML(){
 const mode=S.calMode,H0=540,H1=1320,PX=48;
 if(mode==='month'){
  const first=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);const lead=(first.getDay()+6)%7;const dim=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();
  let cells='';for(let i=0;i<lead;i++)cells+='<div class="md blank"></div>';
  for(let d=1;d<=dim;d++){const dt=new Date(TODAY.getFullYear(),TODAY.getMonth(),d);const k=keyOf(dt);const sc=sched(ME,k);const n=sc.off?0:sc.busy.filter(b=>!b.block).length;cells+=`<div class="md ${sc.off?'off':''} ${k===dk(0)?'today':''}"><span>${d}</span>${sc.off?`<i style="color:var(--muted)">${sc.reason==='Выходной'?'вых':sc.reason.toLowerCase().slice(0,6)}</i>`:`<i>${n} ${plural(n,['запись','записи','записей'])}</i>`}</div>`}
  return `<h3 class="h3">${MONN[TODAY.getMonth()]} ${TODAY.getFullYear()}</h3><div class="month">${['пн','вт','ср','чт','пт','сб','вс'].map(w=>`<div class="mh">${w}</div>`).join('')}${cells}</div>`;
 }
 const days=mode==='day'?[0]:[0,1,2,3,4,5,6];
 let hours='';for(let t=H0;t<H1;t+=60)hours+=`<div>${fmtT(t)}</div>`;
 const cols=days.map(i=>{const k=dk(i);const sc=sched(ME,k);let ev='';
  if(!sc.off){
   if(sc.br)ev+=`<div class="ev brk" style="top:${(sc.br[0]-H0)/60*PX}px;height:${(sc.br[1]-sc.br[0])/60*PX-2}px">Перерыв</div>`;
   if(sc.st>H0)ev+=`<div class="ev blk" style="top:0;height:${(sc.st-H0)/60*PX}px;border:0;border-radius:0;left:0;right:0;opacity:.6"></div>`;
   if(sc.en<H1)ev+=`<div class="ev blk" style="top:${(sc.en-H0)/60*PX}px;height:${(H1-sc.en)/60*PX}px;border:0;border-radius:0;left:0;right:0;opacity:.6"></div>`;
   sc.busy.forEach(b=>{const bk=b.block?null:mBookings(i,i).find(x=>x.s===b.s);if(!b.block&&!bk)return;ev+=`<div class="ev ${b.block?'blk':b.own?'own':bk.status==='pending'?'pending':''}" style="top:${(b.s-H0)/60*PX+1}px;height:${(b.e-b.s)/60*PX-3}px"><b>${fmtT(b.s)}${b.block?' Заблокировано':' '+esc(bk.name)}</b>${b.block?'':SVM[b.svc].n}</div>`});
  }
  return `<div class="cal-col ${sc.off?'off':''}" style="height:${(H1-H0)/60*PX}px">${sc.off?`<div class="ev blk" style="top:8px;height:auto;border-left-color:transparent">${sc.reason}</div>`:''}${ev}</div>`}).join('');
 const heads=days.map(i=>{const d=addD(i);return `<div class="cal-h ${i===0?'today':''}">${i===0?'Сегодня':WD[d.getDay()]}<small>${d.getDate()} ${MONS[d.getMonth()]}</small></div>`}).join('');
 return `<div class="cal-wrap"><div class="cal" style="grid-template-columns:56px repeat(${days.length},minmax(${mode==='day'?'240px':'96px'},1fr));${mode==='day'?'min-width:0':''}"><div class="cal-h"></div>${heads}<div class="cal-hours">${hours}</div>${cols}</div></div><div class="legend"><span><i style="background:color-mix(in srgb,var(--lacquer) 14%,var(--surface))"></i>подтверждена</span><span><i style="background:var(--warn-bg)"></i>ждёт подтверждения</span><span><i style="background:var(--info-bg)"></i>ваша демо-запись как клиента</span><span><i class="lb"></i>перерыв</span></div>`;
}

function maskPhone(v){let d=v.replace(/\D/g,'');if(d.startsWith('8'))d='7'+d.slice(1);if(!d.startsWith('7'))d='7'+d;d=d.slice(0,11);let o='+7';if(d.length>1)o+=' ('+d.slice(1,4);if(d.length>=4)o+=')';if(d.length>4)o+=' '+d.slice(4,7);if(d.length>7)o+='-'+d.slice(7,9);if(d.length>9)o+='-'+d.slice(9,11);return o}

document.addEventListener('submit',e=>{
 const f=e.target;if(f.dataset.form!=='finder')return;e.preventDefault();
 resetF();const dd=$('#h-d').value,sv=$('#h-s').value,dt=$('#h-dt').value,tm=$('#h-t').value,st=$('#h-st').value;
 if(dd)S.f.district=[dd];if(sv)S.f.svc=sv;if(dt.startsWith('k:')){S.f.date='pick';S.f.dateKey=dt.slice(2)}else S.f.date=dt;S.f.time=tm;if(st)S.f.styles=[st];
 go('search');
});
function readFiles(input,cb){[...input.files].slice(0,4).forEach(f=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)})}
document.addEventListener('input',e=>{
 const el=e.target,k=el.dataset.f;if(!k)return;
 if(k==='q'){S.f.q=el.value;renderResults()}
 else if(k==='pmin'||k==='pmax'){let a=+$('#f-pmin').value,b=+$('#f-pmax').value;if(a>b-300){if(k==='pmin'){a=b-300;el.value=a}else{b=a+300;el.value=b}}S.f.pmin=a;S.f.pmax=b;renderResults()}
 else if(k==='bk-name'){S.bk.name=el.value;$('#bk-next').disabled=!bkValid()}
 else if(k==='bk-phone'||k==='lg-phone'||k==='mask'||k==='u-phone'){const pos=el.value.length;el.value=maskPhone(el.value);if(k==='bk-phone'){S.bk.phone=el.value;$('#bk-next').disabled=!bkValid()}if(k==='lg-phone'){LOGIN.st.phone=el.value;$('#lg-go').disabled=el.value.replace(/\D/g,'').length!==11}}
 else if(k==='bk-comment')S.bk.comment=el.value;
 else if(k==='lg-code'){el.value=el.value.replace(/\D/g,'').slice(0,1);if(el.value){const n=el.nextElementSibling;n&&n.focus()}const all=$$('[data-f="lg-code"]').every(i=>i.value);$('#lg-go').disabled=!all}
 else if(k==='ad-svc'){S.admin.svcs[+el.dataset.i].n=el.value;save()}
});
document.addEventListener('keydown',e=>{
 if(e.target.dataset?.f==='lg-code'&&e.key==='Backspace'&&!e.target.value){const p=e.target.previousElementSibling;p&&p.focus()}
 if(e.key==='Escape'){if($('#filters.open'))A['sheet-close']();else if(LB){LB=null;closeModal()}else closeModal()}
 if(LB&&e.key==='ArrowLeft')A['lb-prev']();if(LB&&e.key==='ArrowRight')A['lb-next']();
});
document.addEventListener('change',e=>{
 const el=e.target,k=el.dataset.f;if(!k)return;
 if(k==='sort'){S.sort=el.value;renderResults()}
 else if(k==='dateKey'){S.f.dateKey=el.value;renderResults()}
 else if(k==='tfrom'||k==='tto'){S.f[k]=+el.value;renderResults()}
 else if(k==='extra'){const a=S.f.extras;const i=a.indexOf(el.value);el.checked?(i<0&&a.push(el.value)):(i>=0&&a.splice(i,1));renderResults()}
 else if(k==='bk-design'){S.bk.design=el.checked;S.bk.t=null;S.bk.hold=null;renderBooking()}
 else if(k==='bk-ref'){readFiles(el,u=>{S.bk.refs.push(u);const box=$('#bk-refs');const img=document.createElement('img');img.src=u;img.alt='Референс';box.insertBefore(img,box.lastElementChild)})}
 else if(k==='rv-photo'){readFiles(el,u=>{REV.photos.push(u);const box=$('#rv-ph');const img=document.createElement('img');img.src=u;img.alt='Фото к отзыву';box.insertBefore(img,box.lastElementChild)})}
 else if(k==='avatar'){readFiles(el,u=>{S.user=S.user||{name:'Гость',phone:'',email:''};S.user.avatar=u;save();render();toast('Фото обновлено')})}
 else if(k==='notif'){S.notif[el.value]=el.checked;save();toast('Настройки уведомлений сохранены')}
 else if(k==='m1-start'||k==='m1-end'){S.m1[k==='m1-start'?'start':'end']=+el.value;save();render();toast('График обновлён, слоты пересчитаны')}
 else if(k==='m1-b0'){const v=+el.value;S.m1.br=v<0?null:[v,Math.max(v+30,S.m1.br?S.m1.br[1]:v+60)];save();render()}
 else if(k==='m1-b1'){if(S.m1.br){S.m1.br[1]=Math.max(+el.value,S.m1.br[0]+30);save();render()}}
 else if(k==='m1-auto'){ME.auto=el.checked;toast(el.checked?'Новые записи будут подтверждаться сразу':'Будете подтверждать записи вручную')}
 else if(k==='ad-cat'){S.admin.svcs[+el.dataset.i].cat=el.value;save()}
});
/* slot hold countdown (ТЗ §18: временная блокировка слота) */
setInterval(()=>{
 if(!S.bk||!S.bk.hold)return;const left=S.bk.hold-Date.now();const el=$('#hold-t');
 if(left<=0){S.bk.hold=null;S.bk.t=null;if(S.bk.step>2)S.bk.step=2;toast('Время удержания истекло, выберите время снова');renderBooking();return}
 if(el)el.textContent=fmtHold(left);
},1000);

/* boot */
try{history.replaceState({route:S.role==='client'?'home':S.role==='master'?'pro':'admin',params:{}},'')}catch(e){}
S.route=S.role==='client'?'home':S.role==='master'?'pro':'admin';
render();
})();
</script>
</body>
</html>
